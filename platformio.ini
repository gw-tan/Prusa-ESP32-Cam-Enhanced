; PlatformIO project configuration
; Build a specific board:  pio run -e ai_thinker
; Flash:                   pio run -e ai_thinker -t upload
; Erase (first flash):     pio run -e ai_thinker -t erase && pio run -e ai_thinker -t upload
; Serial monitor:          pio device monitor -b 115200
; All boards:              pio run

[platformio]
default_envs = ai_thinker

; ── Shared base ──────────────────────────────────────────────────────────────
[env]
framework = arduino
; Pinned deliberately. The previous URL used the moving "stable" tag, so an upstream
; release could change the toolchain under an unchanged source tree — and did: a
; platform bump left framework-arduinoespressif32 unresolved and broke the build.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.38/platform-espressif32.zip
monitor_speed = 115200
upload_speed = 921600
lib_deps =
    mathieucarbou/AsyncTCP @ ^3.3.1
    mathieucarbou/ESPAsyncWebServer @ ^3.4.5
    bblanchon/ArduinoJson @ ^7.3.0
    ricaun/ArduinoUniqueID @ ^1.3.0
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DCONFIG_ASYNC_TCP_RUNNING_CORE=0

; ── AI Thinker ESP32-CAM (ESP32, 4 MB flash, 4 MB PSRAM) ─────────────────────
[env:ai_thinker]
board = esp32cam
build_flags =
    ${env.build_flags}
    -DAI_THINKER_ESP32_CAM=true
board_build.partitions = min_spiffs.csv
board_build.flash_mode = dio
board_build.f_flash = 80000000L

; ── Freenove ESP32-Wrover-Dev (ESP32, 4 MB flash, 4 MB PSRAM) ────────────────
[env:wrover]
board = esp-wrover-kit
build_flags =
    ${env.build_flags}
    -DESP32_WROVER_DEV=true
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
board_build.partitions = min_spiffs.csv
board_build.flash_mode = dio
board_build.f_flash = 80000000L

; ── ESP32-S3-EYE 2.2 (ESP32-S3, 8 MB flash, 8 MB OPI PSRAM) ─────────────────
[env:esp32s3_eye]
board = esp32-s3-devkitc-1
build_flags =
    ${env.build_flags}
    -DCAMERA_MODEL_ESP32_S3_EYE_2_2=true
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
board_build.partitions = default_8MB.csv
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 8MB

; ── Freenove ESP32-S3-Wroom (ESP32-S3, 8 MB flash, 8 MB OPI PSRAM) ───────────
[env:freenove_s3_wroom]
board = esp32-s3-devkitc-1
build_flags =
    ${env.build_flags}
    -DESP32_S3_WROOM_FREENOVE=true
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
board_build.partitions = default_8MB.csv
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 8MB

; ── Seeed Studio XIAO ESP32-S3 Sense (ESP32-S3, 8 MB flash) ──────────────────
[env:xiao_esp32s3]
board = seeed_xiao_esp32s3
build_flags =
    ${env.build_flags}
    -DCAMERA_MODEL_XIAO_ESP32_S3_CAM=true
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
board_build.partitions = default_8MB.csv
board_upload.flash_size = 8MB

; ── ESP32-S3-CAM (ESP32-S3, 8 MB flash, 8 MB OPI PSRAM) ─────────────────────
[env:esp32s3_cam]
board = esp32-s3-devkitc-1
build_flags =
    ${env.build_flags}
    -DCAMERA_MODEL_ESP32_S3_CAM=true
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
board_build.partitions = default_8MB.csv
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 8MB
